<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ff8a32" />
    <meta
      name="description"
      content="Manage tasks, projects, work schedules, and connected tools."
    />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link
      rel="icon"
      type="image/png"
      href="/momentum-favicon-32.png"
      sizes="32x32"
    />
    <link rel="icon" type="image/svg+xml" href="/momentum-favicon.svg" />
    <link rel="apple-touch-icon" href="/momentum-apple-touch.png" />
    <link rel="stylesheet" href="/startup.css" />
    <title>Kazi · Tasks & projects</title>
  </head>
  <body>
    <div id="root">
      <div
        class="loading-shell"
        role="status"
        aria-label="Opening Kazi"
        aria-busy="true"
      >
        <div class="loading-content">
          <svg
            class="loading-signal"
            viewBox="0 -24 480 424"
            width="480"
            height="424"
            aria-hidden="true"
            focusable="false"
          >
            <path
              class="loading-step"
              fill="#FF8A32"
              d="M4 331c0-16 7-30 19-40l82-69c18-15 42-2 42 21v94c0 18-14 33-32 33H41c-21 0-37-17-37-39Z"
            />
            <path
              class="loading-step"
              fill="#E9488B"
              d="M175 201c0-14 7-27 19-37l76-60c17-13 39-2 39 19v70c0 10-2 15-8 21l-46 45c-7 8-8 18-1 26l55 60c8 8 3 25-9 25h-96c-16 0-29-13-29-29Z"
            />
            <path
              class="loading-step"
              fill="#4263EB"
              d="M339 98c0-11 6-22 17-31l61-52c16-14 36-14 52 0 7 6 7 17 7 29v293c0 18-14 33-32 33h-32c-14 0-25-4-35-16l-60-65c-11-12-11-21 0-33l84-84c3-3 2-4-2-4h-60Z"
            />
          </svg>
          <div class="loading-copy">
            <p class="loading-title">Opening Kazi</p>
            <p class="loading-description">Getting your workspace ready</p>
          </div>
        </div>
      </div>
    </div>
    <noscript>Kazi needs JavaScript enabled to open your account.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
