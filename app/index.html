<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ff8a32" />
    <meta
      name="description"
      content="Manage tasks, projects, work schedules, and connected tools."
    />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link
      rel="icon"
      type="image/png"
      href="/momentum-favicon-32.png"
      sizes="32x32"
    />
    <link rel="icon" type="image/svg+xml" href="/momentum-favicon.svg" />
    <link rel="apple-touch-icon" href="/momentum-apple-touch.png" />
    <link rel="stylesheet" href="/startup.css" />
    <title>Kazi · Tasks & projects</title>
  </head>
  <body>
    <div id="root">
      <div
        class="loading-shell"
        role="status"
        aria-label="Opening Kazi"
        aria-busy="true"
      >
        <div class="loading-brand">
          <img
            class="kazi-logo"
            src="/brand/kazi-logo.svg"
            alt="Kazi"
            width="985"
            height="256"
            draggable="false"
          />
        </div>
        <div class="loading-sidebar" aria-hidden="true">
          <span class="loading-bar"></span><span class="loading-bar"></span
          ><span class="loading-bar"></span><span class="loading-bar"></span
          ><span class="loading-bar"></span>
        </div>
        <div class="loading-header" aria-hidden="true">
          <span class="loading-bar"></span>
        </div>
        <div class="loading-content" aria-hidden="true">
          <div class="loading-bar loading-title"></div>
          <div class="loading-tiles">
            <div class="loading-tile">
              <span class="loading-bar"></span><span class="loading-bar"></span>
            </div>
            <div class="loading-tile">
              <span class="loading-bar"></span><span class="loading-bar"></span>
            </div>
            <div class="loading-tile">
              <span class="loading-bar"></span><span class="loading-bar"></span>
            </div>
          </div>
          <div class="loading-panels">
            <div class="loading-panel">
              <div class="loading-bar loading-title"></div>
              <div class="loading-row">
                <span class="loading-dot"></span
                ><span class="loading-bar"></span>
              </div>
              <div class="loading-row">
                <span class="loading-dot"></span
                ><span class="loading-bar"></span>
              </div>
              <div class="loading-row">
                <span class="loading-dot"></span
                ><span class="loading-bar"></span>
              </div>
              <div class="loading-row">
                <span class="loading-dot"></span
                ><span class="loading-bar"></span>
              </div>
            </div>
            <div class="loading-panel">
              <div class="loading-bar loading-title"></div>
              <div class="loading-row">
                <span class="loading-dot"></span
                ><span class="loading-bar"></span>
              </div>
              <div class="loading-row">
                <span class="loading-dot"></span
                ><span class="loading-bar"></span>
              </div>
              <div class="loading-row">
                <span class="loading-dot"></span
                ><span class="loading-bar"></span>
              </div>
              <div class="loading-row">
                <span class="loading-dot"></span
                ><span class="loading-bar"></span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <noscript>Kazi needs JavaScript enabled to open your account.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
